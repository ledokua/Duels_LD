plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
    // Gives libs/*.jar module coordinates (":VectorLib-fabric:<version>") so Loom's `include`
    // (jar-in-jar) accepts them; plain `include files(...)` is rejected.
    flatDir { dirs 'libs' }
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/"; content { includeGroup "dev.emi" } }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "eu.pb4:placeholder-api:${project.placeholder_api_version}"
    // VectorLib (canvas UI for the screens). Bundled jar-in-jar so the production jar works
    // standalone; the loader keeps the highest version among the mods that bundle it.
    modImplementation files("libs/VectorLib-fabric-${project.vectorlib_version}.jar")
    include ":VectorLib-fabric:${project.vectorlib_version}"
    modImplementation fileTree(
            dir: "${project.projectDir}/libs",
            include: ["BusyLib-*.jar"],
            exclude: ["*sources.jar"]
    )
    modCompileOnly fileTree(
            dir: "${project.projectDir}/libs",
            include: ["Economy_LD-*.jar"],
            exclude: ["*sources.jar"]
    )
    modRuntimeOnly fileTree(
            dir: "${project.projectDir}/libs",
            include: ["Economy_LD-*.jar"],
            exclude: ["*sources.jar"]
    )
    // Eden_LD (optional): parties and friendly-fire protection. Compiled against, never bundled;
    // reached only through integration/EdenBridge. Eden's own jar-in-jar VectorLib isn't unpacked
    // from a local fileTree, but the VectorLib above covers it in dev runs.
    modCompileOnly fileTree(
            dir: "${project.projectDir}/libs",
            include: ["Eden_LD-*.jar"],
            exclude: ["*sources.jar"]
    )
    modRuntimeOnly fileTree(
            dir: "${project.projectDir}/libs",
            include: ["Eden_LD-*.jar"],
            exclude: ["*sources.jar"]
    )
    // EMI (optional): only to keep its panels off the stake screen (client/compat/DuelsEmiPlugin).
    modCompileOnly("dev.emi:emi-fabric:1.1.24+1.21.1:api") { transitive = false }
    modLocalRuntime("dev.emi:emi-fabric:1.1.24+1.21.1") { transitive = false }
    // Economy_LD bundles its JDBC driver as a jar-in-jar, but Loom does not unpack nested jars
    // from a local fileTree mod in the dev runtime, so the driver is missing on the classpath
    // ("No suitable driver found for jdbc:sqlite"). Provide it explicitly for dev runs only.
    runtimeOnly "org.xerial:sqlite-jdbc:3.49.1.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
